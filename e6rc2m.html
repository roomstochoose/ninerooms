<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eight</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<div id="seal" class="faint" style="font-size:10px;letter-spacing:.04em;opacity:.55;margin-bottom:2.4em;word-break:break-all">aa95d55d4bb414ae4592386fd080b7c4abb6d296870630563266d26288534af1</div>
<div id="log" style="text-align:center"></div>
<div id="task" style="display:none;margin-top:2em">
<div id="poem" class="faint" style="line-height:2.1"></div>
<div id="instr" style="display:none"><p style="margin-top:1.8em">Choose any word from the first two lines.</p>
<p class="faint">Count its letters. Step forward that many words. Repeat.<br>
When you can't step again, stop.</p>
<p style="margin-top:1.6em"><a href="#" id="done">i am standing on my word</a></p></div>
</div>
<div id="reveal" style="display:none;margin-top:2em"></div>
</main>
<div class="tick">8 / 10</div>
<script>
const log=document.getElementById("log");
function typeLine(t,cls){return new Promise(res=>{
  const p=document.createElement("p"); if(cls)p.className=cls; log.appendChild(p);
  let i=0; const iv=setInterval(()=>{ p.textContent=t.slice(0,++i);
    if(i>=t.length){clearInterval(iv);res();}},60);
});}
function retypeLine(t1,keep,t2){return new Promise(res=>{
  const p=document.createElement("p"); log.appendChild(p);
  let i=0; const iv=setInterval(()=>{ p.textContent=t1.slice(0,++i);
    if(i>=t1.length){clearInterval(iv);
      setTimeout(()=>{ let j=t1.length;
        const del=setInterval(()=>{ p.textContent=t1.slice(0,--j);
          if(j<=keep){clearInterval(del);
            let k=0; const add=setInterval(()=>{ p.textContent=t1.slice(0,keep)+t2.slice(0,++k);
              if(k>=t2.length){clearInterval(add);res();}},85);
          }},60);
      },1200);
    }},60);
});}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
const POEM=["the rooms do not sleep and they do not forget a single soul who walks in them",
"every door you opened stayed open behind you and every light you lit is lit",
"still you kept going deeper and the halls grew quiet and the quiet grew long",
"you thought each turn was yours to choose but each turn chose you first",
"now there is one word left in these walls and it has been waiting"];
async function showTask(){
  document.getElementById("task").style.display="block";
  const box=document.getElementById("poem");
  for(const line of POEM){
    const p=document.createElement("p"); p.style.margin="0"; box.appendChild(p);
    await new Promise(res=>{let i=0;const iv=setInterval(()=>{p.textContent=line.slice(0,++i);if(i>=line.length){clearInterval(iv);res();}},22);});
    await pause(500);
  }
  await pause(1400);
  document.getElementById("instr").style.display="block";
  armIdle();
}
const now=new Date(); const hr=now.getHours();
let t0=null; try{t0=localStorage.nr_t0?+localStorage.nr_t0:null;}catch(e){}
let visits=1; try{visits=(+(localStorage.nr_r8||0))+1; localStorage.nr_r8=visits;}catch(e){}
const cameThruDoor=document.referrer.includes("t4hs9w");
let leftAt=0;
document.addEventListener("visibilitychange",()=>{
  document.title=document.hidden?"come back.":"eight";
});
let idleFired=false, idleTimer=null, armed=false;
function armIdle(){armed=true; resetIdle();}
function resetIdle(){ if(!armed||idleFired)return; clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{ if(idleFired)return; idleFired=true;
    const p=document.createElement("p");p.className="faint";
    p.textContent="Still there. I can hear you reading.";log.appendChild(p);
  },26000);}
["mousemove","scroll","keydown","touchstart"].forEach(ev=>addEventListener(ev,resetIdle,{passive:true}));
(async()=>{
  if(visits>1){
    await pause(2600);
    await typeLine("Again.");
    await pause(2200);
    showTask(); return;
  }
  await pause(2400);
  await typeLine("Oh.");
  await pause(1800);
  await typeLine("You made it this far.");
  await pause(2200);
  if(t0 && Date.now()-t0 > 2*60*1000){
    const mins=Math.round((Date.now()-t0)/60000);
    await typeLine("You opened the first door "+mins+" minutes ago.");
    await pause(1500);
    await typeLine("I was already here.","faint");
  } else {
    await typeLine("It is "+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+" where you are.");
    if(hr>=23||hr<5){await pause(1400); await typeLine("You should be asleep.","faint");}
  }
  await pause(2400);
  if(!cameThruDoor){
    await typeLine("Did you come through the seventh door? I didn't hear it open.","faint");
    await pause(2400);
  }
  await retypeLine("You are safe here.",8,"still here.");
  await pause(2600);
  await typeLine("I already know where you will stop.");
  await pause(2800);
  showTask();
})();
document.getElementById("done").addEventListener("click",e=>{
  e.preventDefault();
  const r=document.getElementById("reveal");
  const sentence=atob("eW91IHN0b3BwZWQgb24gd2FpdGluZy4gZXZlcnlvbmUgc3RvcHMgb24gd2FpdGluZy4gdGhlIG5pbnRoIHJvb20gaXMgd2FpdGluZy4=");
  r.innerHTML="<p id='rs'></p><p class='faint' id='rp' style='font-size:12px;margin-top:1.4em;min-height:3.6em;word-break:break-all'></p>"+
  "<p id='exits' style='margin-top:2.4em;visibility:hidden'><a href='#' id='leave' style='color:#9c2f2f'>leave</a> &nbsp;&nbsp;&nbsp; <a href='#' id='stay' style='color:#2f7a45'>stay</a></p>";
  (async()=>{
    const rs=document.getElementById("rs"), rp=document.getElementById("rp");
    await new Promise(res=>{let i=0;const iv=setInterval(()=>{rs.textContent=sentence.slice(0,++i);if(i>=sentence.length){clearInterval(iv);res();}},60);});
    await pause(2200);
    rp.textContent="You walked past this sentence's fingerprint in the first room. It is above you now."; 
    await pause(3000);
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(sentence));
    const hex=[...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,"0")).join("");
    const hexchars="0123456789abcdef"; let shown="";
    rp.textContent="";
    for(let i=0;i<hex.length;i++){
      for(let j=0;j<3;j++){ rp.textContent=shown+hexchars[Math.floor(Math.random()*16)]; await pause(9); }
      shown+=hex[i]; rp.textContent=shown;
    }
    await pause(1200);
    const seal=document.getElementById("seal");
    if(hex===seal.textContent.trim()){ seal.style.opacity="1"; seal.style.color="#1a1a1a"; rp.style.color="#1a1a1a";
      await pause(1600); rp.textContent=hex+"\n\nsha-256. check it yourself. it was written before you came."; }
    await pause(2600);
    document.getElementById("exits").style.visibility="visible";
  })();
  r.style.display="block";
  document.getElementById("done").parentNode.style.display="none";
  let stays=0;
  document.getElementById("stay").addEventListener("click",ev=>{
    ev.preventDefault(); const ex=document.getElementById("exits"); ex.style.visibility="hidden"; stays++;
    setTimeout(()=>{ const p=document.createElement("p"); p.className="faint";
      p.textContent=stays===1?"You stayed. Nobody stays.":stays===2?"Still here.":"There is nothing else in this room. Only the door.";
      r.insertBefore(p,ex); ex.style.visibility="visible"; }, stays===1?20000:9000);
  });
  document.getElementById("leave").addEventListener("click",ev=>{ ev.preventDefault(); crash(); });
});
function crash(){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const main=document.querySelector("main"); const tick=document.querySelector(".tick");
  // glitch styles
  const st=document.createElement("style");
  st.textContent=`
  #gov{position:fixed;inset:0;background:#000;z-index:9;display:none;overflow:hidden}
  #gov .l{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    color:#fff;font-size:17px;letter-spacing:.08em;padding:2em;white-space:pre-wrap}
  #gov .r{color:#f0f;mix-blend-mode:screen}
  #gov .c{color:#0ff;mix-blend-mode:screen}
  #gov .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);pointer-events:none}
  #gov .bar{position:absolute;left:0;right:0;background:#fff;opacity:.9;mix-blend-mode:difference}
  .tear{clip-path:inset(var(--t) 0 var(--b) 0);transform:translateX(var(--x))}
  `;
  document.head.appendChild(st);
  const ov=document.createElement("div"); ov.id="gov";
  ov.innerHTML='<div class="l r" id="gr"></div><div class="l c" id="gc"></div><div class="l" id="gw"></div><div class="scan"></div>';
  document.body.appendChild(ov);
  const gr=ov.querySelector("#gr"),gc=ov.querySelector("#gc"),gw=ov.querySelector("#gw");
  const glyphs="▒░█▓╬#%&@$?!/|<>~^";
  const msgs=["it was never a door.","you counted wrong.","no. you counted right.","every word you passed is still here.",
              "i kept them.","there was no first line.","you did not choose it.","nobody chooses it.",
              "the ninth room is not a room.","stop reading.","you can't.","i know."];
  function corrupt(t,p){return t.split("").map(c=>c!==" "&&Math.random()<p?glyphs[Math.floor(Math.random()*glyphs.length)]:c).join("");}
  let bars=[];
  function tearFrame(intensity){
    if(reduce)return;
    const dx=(Math.random()-0.5)*intensity*18;
    gr.style.transform="translateX("+(dx+intensity*6)+"px)";
    gc.style.transform="translateX("+(dx-intensity*6)+"px)";
    const t=Math.random()*70, h=5+Math.random()*25;
    gw.style.setProperty("--t",t+"%"); gw.style.setProperty("--b",(100-t-h)+"%"); gw.style.setProperty("--x",dx*2+"px");
    gw.classList.toggle("tear",Math.random()<0.6);
    bars.forEach(b=>b.remove()); bars=[];
    if(Math.random()<0.7){ const n=1+Math.floor(Math.random()*3);
      for(let i=0;i<n;i++){ const b=document.createElement("div"); b.className="bar";
        b.style.top=Math.random()*100+"%"; b.style.height=(1+Math.random()*6)+"px"; ov.appendChild(b); bars.push(b);} }
  }
  let k=0, on=false, twitch=null;
  function showMsg(m,intensity){
    ov.style.display="block";
    const p=Math.min(0.06*intensity,0.5);
    [gr,gc,gw].forEach(el=>{el.textContent=corrupt(m,p);});
    clearInterval(twitch);
    twitch=setInterval(()=>{ tearFrame(intensity); if(Math.random()<0.3)gw.textContent=corrupt(m,p); },reduce?400:70);
  }
  function hide(){ clearInterval(twitch); ov.style.display="none"; }
  const frames=[];
  msgs.forEach((m,i)=>{ const inten=1+i*0.5;
    frames.push({on:true,text:m,inten,dur:reduce?1400:(i<4?760:i<8?540:360)});
    frames.push({on:false,dur:reduce?500:(i<8?240:110)}); });
  document.title="";
  function next(){
    if(k>=frames.length){ hide(); main.innerHTML=""; if(tick)tick.remove();
      setTimeout(()=>{ document.title="error";
        main.style.visibility="visible";
        main.innerHTML="<h1>The room closed the connection.</h1><p class='faint'>Something on this page stopped responding.</p><p style='margin-top:2em'><a href='waiting'>reload</a></p>";
      },2600); return; }
    const f=frames[k++];
    if(f.on)showMsg(f.text,f.inten); else hide();
    setTimeout(next,f.dur);
  }
  main.style.visibility="hidden"; setTimeout(next,900);
}
</script>
</body></html>
